  """When the activity was created."""
  createdAt: DateTime!

  """
  The dataset of the activity. Null when unknown or not accessible to the caller.
  """
  datasetId: ID

  """
  Why the activity failed. Null unless the state is FAILED; GENERIC when the failure carries no classification. The classification may arrive a few seconds after the failure.
  """
  failureKind: GpuFailureKind

  """
  The configured GPU tasks of the activity with their real Airflow states. Null when the server does not provide task inspection.
  """
  gpuTasks: MyGpuActivityTasks

  """The selected resource mode. Null when unknown."""
  mode: GpuResourceMode

  """
  The requested memory in GB for SLICE. Null for whole-card modes or when unknown.
  """
  requestedMemGb: Int

  """The reserved memory in GB, when granted."""
  reservedMemGb: Float

  """A safe reason code for the current state."""
  safeReason: String

  """The GPU request state."""
  state: GpuRequestState!

  """The display task name."""
  taskName: String!

  """
  Why the activity is waiting. Null when it is not waiting or when the server does not report a reason.
  """
  waitReason: GpuWaitReason
}

